name: CI

# Fast pull request validator — runs tests on PRs to main and dev.
# Direct pushes to dev trigger the full Release and promotion pipeline.

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./cloudsync-cli } }
    strategy:
      matrix:
        node: ['lts/*', '*']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cloudsync-cli/package-lock.json
      - run: npm ci
      - run: npm test
